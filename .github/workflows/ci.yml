name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Los tipos de la API salen de `src/api/openapi-fms.yaml` (copia del contrato del backend): si no coinciden, falla.
      - name: "Tipos de la API al día con el contrato"
        run: npm run api:check
      # typegen genera los tipos de rutas (PageProps, LayoutProps) que tsc necesita sin compilar.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: La salida standalone existe (la imagen sirve .next/standalone/server.js)
        run: test -f .next/standalone/server.js
      - name: Avisos de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  # Humo de la compuerta con la API simulada en el navegador (e2e/README.md). Aparte para no alargar `web`.
  e2e:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci --ignore-scripts
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
