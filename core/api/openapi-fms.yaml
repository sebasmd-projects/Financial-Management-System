      security:
      - appSessionToken: []
      - cvSession: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin sesión.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`mfa_required`, `finance_not_active`, `account_blocked` o
            `reauthentication_required`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe (o es de otro usuario).
        '409':
