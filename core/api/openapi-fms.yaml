            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: El estado actual no lo permite.
    delete:
      operationId: fmsAccountDelete
      description: |-
        Base de los endpoints de **datos** financieros: segundo factor verificado y perfil activado (``permissions.FmsReady``). Los que
        crean usan ``idempotent``: exigen ``Idempotency-Key``; repetirla devuelve el original (200).
      summary: 'Eliminar una cuenta (borrado lógico): con sus movimientos, a la papelera
        30 días; pide antes `GET deletions/preview`'
      parameters:
      - in: path
        name: id
        schema:
          type: string
