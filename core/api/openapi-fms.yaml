        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserScenario'
      required:
      - count
      - page
      - page_size
      - results
    Usury:
      type: object
      properties:
        ea:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
          description: La usura vigente a la fecha (parámetro `USURY_RATE_EA`); `null`
            si no hay.
        exceeded:
          type:
          - boolean
          - 'null'
          description: Aviso (`warning`), no bloqueo.
      required:
      - ea
      - exceeded
    UsuryCheck:
      type: object
      properties:
        usury_known:
          type: boolean
          description: '`false`: no escribiste una tasa de usura vigente en esa fecha
            (no se inventa).'
        effective_annual:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
          description: La tasa consultada en efectiva anual.
        usury:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
        exceeds:
          type: boolean
      required:
      - effective_annual
      - exceeds
      - usury
      - usury_known
    Vehicle:
      type: object
      properties:
        plate:
          type: string
        brand:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        year:
          type:
          - integer
          - 'null'
        odometer_km:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        odometer_on:
          type: string
          format: date
        initial_odometer_km:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        tag_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'La etiqueta del vehículo: la llevan los movimientos de sus
            costos.'
      required:
      - brand
      - initial_odometer_km
      - model
      - odometer_km
      - odometer_on
      - plate
      - tag_id
      - year
    VehicleCost:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/VehicleCostKindEnum'
        recurrence_id:
          type: string
          format: uuid
          description: 'La recurrencia anual: sale en gastos fijos y en el calendario.'
        name:
          type: string
        expected_amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        status:
          type: string
        next_due:
          type:
          - string
          - 'null'
          format: date
        notify_days:
          type: array
          items:
            type: integer
          description: Avisa estos días antes (30 y 7).
      required:
      - expected_amount
      - id
      - kind
      - name
      - next_due
      - notify_days
      - recurrence_id
      - status
    VehicleCostCreate:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/VehicleCostKindEnum'
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        due_date:
          type: string
          format: date
          description: La próxima fecha de pago; se repite cada año ese día.
        account_id:
          type: string
          format: uuid
          description: La cuenta que lo paga.
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        cost_center_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - account_id
      - amount
      - due_date
      - kind
    VehicleCostKindEnum:
      enum:
      - soat
      - technomechanical
      - vehicle_tax
      - insurance
      - other
      type: string
      description: |-
        * `soat` - SOAT
        * `technomechanical` - Technical-mechanical inspection
        * `vehicle_tax` - Vehicle tax
        * `insurance` - Insurance
        * `other` - Other
    VehicleCostSummary:
      type: object
      properties:
        first:
          type: string
          format: date
        last:
          type: string
          format: date
        total:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          description: Lo gastado con la etiqueta del vehículo desde que se registró.
        entries:
          type: integer
        months:
          type: integer
        per_month:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        km_driven:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        per_km:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
      required:
      - entries
      - first
      - km_driven
      - last
      - months
      - per_km
      - per_month
      - total
    VehicleInput:
      type: object
      properties:
        plate:
          type: string
          maxLength: 12
        brand:
          type:
          - string
          - 'null'
          maxLength: 60
        model:
          type:
          - string
          - 'null'
          maxLength: 60
        year:
          type:
          - integer
          - 'null'
          maximum: 2100
          minimum: 1900
        odometer_km:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          default: '0'
      required:
      - plate
    VehicleOdometer:
      type: object
      properties:
        km:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        'on':
          type: string
          format: date
      required:
      - km
      - 'on'
    Verify:
      type: object
      properties:
        ok:
          type: boolean
        entries:
          type: integer
        unbalanced:
          type: array
          items:
            type: string
            format: uuid
        mismatched:
          type: array
          items:
            type: string
            format: uuid
          description: Cuentas cuyo caché difería (ya reparado).
      required:
      - entries
      - mismatched
      - ok
      - unbalanced
    Warning:
      type: object
      properties:
        code:
          type: string
          description: '`possible_duplicate`, `negative_balance`, `credit_limit_exceeded`,
            `rate_above_usury`.'
        'on':
          type: string
          format: date
          description: '`rate_above_usury`: la fecha de la tasa.'
        effective_annual:
          type: string
          description: '`rate_above_usury`: la tasa registrada en efectiva anual.'
        usury:
          type: string
          description: '`rate_above_usury`: la usura vigente en esa fecha (la que
            escribiste).'
        movement_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        balance:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        available:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
      required:
      - code
    WriteStatusEnum:
      enum:
      - pending
      - confirmed
      type: string
      description: |-
        * `pending` - pending
        * `confirmed` - confirmed
  securitySchemes:
    appSessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: Token de sesión del cliente `app` de allauth headless (`/_allauth/app/v1/`).
        Solo vale con un dispositivo vigente; no se usan cookies ni CSRF. Un token
        inválido es 401 sin probar la cookie.
    cvSession:
      type: apiKey
      in: cookie
      name: __Host-cv_session
      description: Cookie de sesión del CV (`cv_session` en desarrollo); las escrituras
        llevan `X-CSRFToken`.
