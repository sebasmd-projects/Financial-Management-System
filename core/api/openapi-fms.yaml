  /api/fms/v1/activation:
    post:
      operationId: fmsActivate
      description: 'Exige una cuenta **Activa** con correo verificado y una sesión
        con segundo factor. Cualquier otra cosa: `403 {code}`. La segunda llamada
        devuelve `200` con `created: false` y no genera otra llave.'
      summary: 'Activar el FMS: crea la llave de datos y guarda el consentimiento
        (idempotente)'
      tags:
      - activation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FmsActivationRequest'
        required: true
      security:
      - appSessionToken: []
      - cvSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FmsActivationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FmsError'
          description: '`accept_version` ausente o mal formada.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FmsError'
          description: Sin sesión.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FmsActivationRefused'
          description: '`email_unverified`, `mfa_required`, `account_blocked` o `consent_mismatch`.'
