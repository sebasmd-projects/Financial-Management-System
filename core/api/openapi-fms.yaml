          allOf:
          - $ref: '#/components/schemas/DecimalSepEnum'
          default: ','
        thousands_sep:
          default: .
          oneOf:
          - $ref: '#/components/schemas/ThousandsSepEnum'
          - $ref: '#/components/schemas/BlankEnum'
