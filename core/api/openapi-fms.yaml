          - 'null'
          format: uuid
        account_id:
          type: string
          format: uuid
        payment_method_id:
          type:
          - string
          - 'null'
          format: uuid
        counterparty:
          type:
          - string
          - 'null'
          maxLength: 80
        nature:
          default: ''
          oneOf:
