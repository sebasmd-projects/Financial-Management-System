          type: integer
          maximum: 50
          minimum: 0
          default: 0
          description: Filas antes de los títulos.
        installments:
          type: string
          default: ''
          description: 'Solo tarjetas: título de la columna con las cuotas de cada
            compra (vacío: una cuota).'
          maxLength: 120
