                $ref: '#/components/schemas/Error'
          description: '`mfa_required`, `finance_not_active`, `account_blocked` o
            `reauthentication_required`.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Valida pero no se puede aplicar (`code` dice por qué).
  /api/fms/v1/user-parameters/{id}:
    patch:
      operationId: fmsUserParameterClose
      description: |-
        Base de los endpoints de **datos** financieros: segundo factor verificado y perfil activado (``permissions.FmsReady``). Los que
        crean usan ``idempotent``: exigen ``Idempotency-Key``; repetirla devuelve el original (200).
      summary: 'Cerrar una vigencia en una fecha (no se cambia su valor: se agrega
        otra vigencia)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - user-parameters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserParameterClose'
      security:
      - appSessionToken: []
      - cvSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserParameter'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Cuerpo inválido o falta `Idempotency-Key`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin sesión.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`mfa_required`, `finance_not_active`, `account_blocked` o
            `reauthentication_required`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe (o es de otro usuario).
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Valida pero no se puede aplicar (`code` dice por qué).
    delete:
      operationId: fmsUserParameterDelete
      description: |-
        Base de los endpoints de **datos** financieros: segundo factor verificado y perfil activado (``permissions.FmsReady``). Los que
        crean usan ``idempotent``: exigen ``Idempotency-Key``; repetirla devuelve el original (200).
      summary: Borrar una vigencia que aún no empieza (lo vigente o pasado se cierra,
        no se borra)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - user-parameters
      security:
      - appSessionToken: []
      - cvSession: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin sesión.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`mfa_required`, `finance_not_active`, `account_blocked` o
            `reauthentication_required`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe (o es de otro usuario).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: El estado actual no lo permite.
  /api/fms/v1/usury/check:
    get:
      operationId: fmsUsuryCheck
      description: |-
        Base de los endpoints de **datos** financieros: segundo factor verificado y perfil activado (``permissions.FmsReady``). Los que
        crean usan ``idempotent``: exigen ``Idempotency-Key``; repetirla devuelve el original (200).
      summary: ¿Esta tasa supera la usura que escribiste para esa fecha? Compara en
        efectiva anual; sin usura vigente no inventa un tope
      parameters:
      - in: query
        name: convention
        schema:
          type: string
        description: '`EA`, `EM`, `NMV`...'
        required: true
      - in: query
        name: 'on'
        schema:
          type: string
        description: '`AAAA-MM-DD`; por defecto hoy.'
      - in: query
        name: rate
        schema:
          type: string
        description: 'Fracción: `0.0285` es 2,85 %.'
        required: true
      tags:
      - usury
      security:
      - appSessionToken: []
      - cvSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuryCheck'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Cuerpo inválido o falta `Idempotency-Key`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin sesión.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`mfa_required`, `finance_not_active`, `account_blocked` o
            `reauthentication_required`.'
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AccountTypeEnum'
        kind:
          $ref: '#/components/schemas/AccountKindEnum'
        system_key:
          type: string
          description: Vacío en las cuentas del usuario.
        name:
          type: string
        last4:
          type:
          - string
          - 'null'
        institution:
          oneOf:
          - $ref: '#/components/schemas/Institution'
          - type: 'null'
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
        currency:
          type: string
        gmf_exempt:
          type: boolean
        liquid:
          type: boolean
        enforce_funds:
          type: boolean
        status:
          $ref: '#/components/schemas/AccountStatusEnum'
        is_default:
          type: boolean
          description: 'La cuenta predeterminada del usuario (a lo sumo una): viene
            preseleccionada al registrar, transferir y pagar.'
        posted_balance:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          description: Confirmado, conciliado y anulado con su reverso. Derivado de
            las líneas (caché cifrado).
        projected_balance:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          description: Lo anterior más los pendientes.
      required:
      - currency
      - enforce_funds
      - gmf_exempt
      - id
      - institution
      - is_default
      - kind
      - last4
      - liquid
      - name
      - parent_id
      - posted_balance
      - projected_balance
      - status
      - system_key
      - type
    AccountCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/AccountCreateKindEnum'
        institution_id:
          type:
          - integer
          - 'null'
        opening_balance:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          default: '0'
          description: Genera un asiento contra «Patrimonio inicial».
        opening_date:
          type: string
          format: date
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Obligatorio en un bolsillo.
        last4:
          type:
          - string
          - 'null'
          maxLength: 4
        gmf_exempt:
          type: boolean
          default: false
        liquid:
          type:
          - boolean
          - 'null'
        enforce_funds:
          type: boolean
          default: false
      required:
      - kind
      - name
    AccountCreateKindEnum:
      enum:
      - savings
      - checking
      - cash
      - wallet
      - pocket
      - fund
      type: string
      description: |-
        * `savings` - Savings account
        * `checking` - Checking account
        * `cash` - Cash
        * `wallet` - Digital wallet
        * `pocket` - Pocket
        * `fund` - Fund
    AccountKindEnum:
      enum:
      - savings
      - checking
      - cash
      - wallet
      - pocket
      - fund
      - credit_card
      - loan
      - receivable
      - personal_debt
      - income_category
      - expense_category
      - system
      - vehicle
      - property
      - investment
      - other_asset
      type: string
      description: |-
        * `savings` - Savings account
        * `checking` - Checking account
        * `cash` - Cash
        * `wallet` - Digital wallet
        * `pocket` - Pocket
        * `fund` - Fund
        * `credit_card` - Credit card
        * `loan` - Loan
        * `receivable` - Receivable (they owe me)
        * `personal_debt` - Personal debt (I owe)
        * `income_category` - Income category
        * `expense_category` - Expense category
        * `system` - System account
        * `vehicle` - Vehicle
        * `property` - Property
        * `investment` - Investment
        * `other_asset` - Other asset
    AccountPage:
