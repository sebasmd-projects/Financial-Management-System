    LoanCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        principal:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
          description: En pesos (hasta 2 decimales) o, con `unit = UVR`, en unidades
            UVR (hasta 4). Nunca se redondea.
        rate:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
          description: 'Con tasa variable (`index_key` + `margin`) se ignora: la tasa
            es el índice de la fecha de desembolso más el margen.'
        unit:
          allOf:
          - $ref: '#/components/schemas/LoanUnitEnum'
          default: COP
        index_key:
          allOf:
          - $ref: '#/components/schemas/LoanIndexEnum'
          default: ''
          description: |-
            Tasa variable: el índice que escribiste en tus parámetros (con su fuente). Sin valor vigente en la fecha de desembolso: `422 index_missing`.

            * `DTF_EA` - DTF_EA
            * `IBR_EA` - IBR_EA
            * `IPC_ANNUAL` - IPC_ANNUAL
        margin:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
          description: Margen sobre el índice, como fracción (`0.05`).
        rate_convention:
          $ref: '#/components/schemas/RateConventionEnum'
        term:
          type: integer
          maximum: 600
          minimum: 1
        first_due_date:
          type: string
          format: date
        disbursement_date:
          type: string
          format: date
        system:
          allOf:
          - $ref: '#/components/schemas/AmortizationSystemEnum'
          default: french
        insurance:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
          default: '0'
          description: Seguro mensual (en UVR si `unit = UVR`).
        institution_id:
          type:
          - integer
          - 'null'
        disbursement_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Si se indica, el desembolso entra a esa cuenta; si no, el pasivo
            arranca con lo que queda por pagar.
        paid_installments:
          type: integer
          maximum: 599
          minimum: 0
          default: 0
        holiday_rule:
          allOf:
          - $ref: '#/components/schemas/HolidayRuleEnum'
          default: next
        kind:
          allOf:
          - $ref: '#/components/schemas/LoanKindEnum'
          default: personal
        bank_installment:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
          description: 'Opcional: la cuota que te cobra el banco. Si se envía, el
            seguro y otros cargos mensuales se ajustan a la diferencia con capital
            + interés (sustituye a `insurance` y `other_charges`).'
        interest_start:
          type:
          - string
          - 'null'
          format: date
          description: Desde cuándo corren los intereses de la cuota 1 (por defecto,
            el desembolso). Si el banco ya cobró aparte los del periodo inicial, el
            día siguiente.
        other_charges:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
          default: '0'
          description: Otros cargos por cuota (en UVR si `unit = UVR`).
        custom_capitals:
          type:
          - array
          - 'null'
          items:
            type: string
            pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
            example: '0.24'
          description: 'Solo con `system = custom`: el capital de cada cuota menos
            la última (la última cierra el saldo).'
          maxItems: 600
        rate_source:
          type: string
          default: Indicada al crear el préstamo.
          description: De dónde sale la tasa (el contrato, el extracto...).
          maxLength: 200
        late_rate:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '0.24'
          description: Tasa de mora del contrato, si la conoces.
        late_rate_convention:
          allOf:
