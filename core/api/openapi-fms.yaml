          type: string
          default: ''
          maxLength: 120
        date_format:
          allOf:
          - $ref: '#/components/schemas/StatementDateFormatEnum'
          description: |-
            Obligatorio: una fecha ambigua (`03/04/2026`) no se adivina.

            * `%d/%m/%Y` - %d/%m/%Y
            * `%m/%d/%Y` - %m/%d/%Y
            * `%Y-%m-%d` - %Y-%m-%d
            * `%d-%m-%Y` - %d-%m-%Y
            * `%Y/%m/%d` - %Y/%m/%d
            * `%d/%m/%y` - %d/%m/%y
            * `%d.%m.%Y` - %d.%m.%Y
            * `%Y%m%d` - %Y%m%d
