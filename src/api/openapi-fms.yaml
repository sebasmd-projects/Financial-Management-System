      - kind
      - name
    AccountCreateKindEnum:
      enum:
      - savings
      - checking
      - cash
      - wallet
      - pocket
      - fund
      type: string
      description: |-
        * `savings` - Savings account
        * `checking` - Checking account
        * `cash` - Cash
        * `wallet` - Digital wallet
        * `pocket` - Pocket
        * `fund` - Fund
    AccountKindEnum:
      enum:
      - savings
      - checking
      - cash
      - wallet
      - pocket
      - fund
      - credit_card
      - loan
      - receivable
      - personal_debt
      - income_category
      - expense_category
      - system
      type: string
      description: |-
        * `savings` - Savings account
        * `checking` - Checking account
        * `cash` - Cash
        * `wallet` - Digital wallet
        * `pocket` - Pocket
        * `fund` - Fund
        * `credit_card` - Credit card
        * `loan` - Loan
        * `receivable` - Receivable (they owe me)
