                $ref: '#/components/schemas/Error'
          description: Valida pero no se puede aplicar (`code` dice por qué).
  /api/fms/v1/transfers:
    post:
      operationId: fmsTransferCreate
      description: |-
        Base de los endpoints de **datos** financieros: segundo factor verificado y perfil activado (``permissions.FmsReady``). Los que
        crean usan ``idempotent``: exigen ``Idempotency-Key``; repetirla devuelve el original (200).
      summary: Transferir entre cuentas propias; con GMF (4x1000) si el origen no
        es exento, con la tasa vigente de Parámetros
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 8 a 128 caracteres (`A-Za-z0-9._:-`). Repetir la petición devuelve
          el original (200) sin crear otro.
        required: true
      tags:
      - transfers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCreate'
        required: true
      security:
      - cvSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Cuerpo inválido o falta `Idempotency-Key`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin sesión.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`mfa_required`, `finance_not_active` o `account_blocked`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe (o es de otro usuario).
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Valida pero no se puede aplicar (`code` dice por qué).
