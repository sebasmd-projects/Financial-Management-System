    Recurrence:
      type: object
      description: La regla de fechas (diseño §3.10).
      properties:
        months:
          type: array
          items:
            type: integer
            maximum: 12
            minimum: 1
          description: Meses del año en que ocurre (p. ej. `[2, 8]` la matrícula);
            sustituye el paso de la frecuencia.
          maxItems: 12
        skip_months:
          type: array
          items:
            type: integer
            maximum: 12
            minimum: 1
          description: Meses sin ocurrencias cada año (p. ej. `[12, 1]` el transporte
            escolar).
          maxItems: 12
