      - id
      - institution
      - kind
      - last4
      - liquid
      - name
      - parent_id
      - posted_balance
      - projected_balance
      - status
      - system_key
      - type
    AccountCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/AccountCreateKindEnum'
        institution_id:
          type:
          - integer
          - 'null'
        opening_balance:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          default: '0'
          description: Genera un asiento contra «Patrimonio inicial».
        opening_date:
          type: string
          format: date
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
