          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin sesión.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`mfa_required`, `finance_not_active` o `account_blocked`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe (o es de otro usuario).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: El estado actual no lo permite.
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AccountTypeEnum'
        kind:
          $ref: '#/components/schemas/AccountKindEnum'
        system_key:
          type: string
          description: Vacío en las cuentas del usuario.
        name:
          type: string
        last4:
          type:
          - string
          - 'null'
        institution:
          oneOf:
          - $ref: '#/components/schemas/Institution'
          - type: 'null'
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
        currency:
          type: string
        gmf_exempt:
          type: boolean
        liquid:
          type: boolean
        enforce_funds:
          type: boolean
        status:
          $ref: '#/components/schemas/AccountStatusEnum'
        posted_balance:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
