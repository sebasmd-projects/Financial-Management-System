          type: string
          format: date
        end_date:
          type:
          - string
          - 'null'
          format: date
        day:
          type:
          - integer
          - 'null'
          maximum: 31
          minimum: 1
          description: Día del mes (un 31 en un mes corto cae el último).
        last_day:
          type: boolean
          default: false
          description: «Último día del mes».
        weekday:
          type:
          - integer
          - 'null'
          maximum: 6
          minimum: 0
          description: 'Semanal: 0 = lunes.'
        month:
          type:
          - integer
          - 'null'
          maximum: 12
          minimum: 1
          description: Mes ancla de las frecuencias de más de un mes.
        interval:
          type:
          - integer
          - 'null'
          maximum: 365
          minimum: 1
          description: '`every_n_days`: N.'
        custom_days:
          type: array
          items:
            type: integer
            maximum: 31
            minimum: 1
          maxItems: 31
        nth_business_day:
          type:
          - integer
          - 'null'
          maximum: 23
          minimum: 1
        last_weekday:
          type:
          - integer
          - 'null'
          maximum: 6
          minimum: 0
        holiday_rule:
          allOf:
          - $ref: '#/components/schemas/HolidayRuleEnum'
          default: none
          description: |-
            Festivos y fines de semana: mismo día, siguiente hábil o anterior hábil.

            * `none` - none
            * `next` - next
            * `previous` - previous
        early_days_before:
          type:
          - integer
          - 'null'
          maximum: 366
          minimum: 0
          description: Días antes del vencimiento en que termina el pronto pago.
        early_kind:
          description: |-
            `percent` o `fixed`.

            * `percent` - percent
            * `fixed` - fixed
          oneOf:
          - $ref: '#/components/schemas/EarlyKindEnum'
          - $ref: '#/components/schemas/BlankEnum'
        early_value:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          description: Porcentaje (`10`) o monto del descuento.
        late_kind:
          allOf:
          - $ref: '#/components/schemas/LateKindEnum'
          description: |-
            `fixed`, `percent` o `daily` (interés de mora diario de la tasa vigente `late_rate_key`).

            * `none` - none
            * `fixed` - fixed
            * `percent` - percent
            * `daily` - daily
        late_value:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          description: Monto o porcentaje del recargo.
        late_rate_key:
          type: string
          description: Clave del parámetro con vigencia (tasa efectiva anual, fracción)
            para `daily`.
          maxLength: 40
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/RecurrenceKindEnum'
        type:
          $ref: '#/components/schemas/AmountTypeEnum'
        name:
          type: string
        expected_amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        is_estimate:
          type: boolean
        category_id:
          type:
          - string
          - 'null'
          format: uuid
        account_id:
          type: string
          format: uuid
        payment_method_id:
          type:
          - string
          - 'null'
          format: uuid
        counterparty:
          type:
          - string
          - 'null'
        nature:
          type: string
        classification:
          type: string
        status:
          $ref: '#/components/schemas/RecurrenceStatusEnum'
        auto_confirm:
          type: boolean
          description: 'Solo si lo activaste en esta recurrencia: se confirma sola
            al llegar la fecha y se te avisa.'
        provider:
          type:
          - string
          - 'null'
        renewal_date:
          type:
          - string
          - 'null'
          format: date
        auto_renews:
          type: boolean
        cancel_alert_days:
          type:
          - integer
          - 'null'
        next_dates:
          type: array
          items:
            type: string
            format: date
          description: Las próximas 3 fechas ajustadas.
      required:
      - account_id
      - auto_confirm
      - auto_renews
      - cancel_alert_days
      - category_id
      - classification
      - counterparty
      - expected_amount
      - frequency
      - id
      - is_estimate
      - kind
      - name
      - nature
      - next_dates
      - payment_method_id
      - provider
      - renewal_date
      - start_date
      - status
      - type
