          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
        spent:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          description: 'Lo ejecutado: se **lee** de los asientos de gasto, nunca se
            guarda.'
        remaining:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,24})(\.[0-9]{1,12})?$
          example: '180000'
          description: '`limit - spent`; negativo si se pasó.'
        exceeded_by:
          type: string
