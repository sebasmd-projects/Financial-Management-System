openapi: 3.1.0
info:
  title: 'FMS: API privada de finanzas'
  version: 0.2.0
  description: Sesión del CV (cookie `__Host-cv_session`) + cabecera `X-CSRFToken`
    en las escrituras (el token sale de `GET /_allauth/cv/v1/csrf`). Los montos viajan
    como cadenas decimales. Contrato de FMS-0; las rutas de los módulos se añaden
    en sus fases. Las creaciones exigen la cabecera `Idempotency-Key`. Toda ruta de
    datos pide segundo factor verificado y perfil activado. Lo genera `manage.py fms_schema`.
paths:
  /api/fms/v1/accounts:
    get:
      operationId: fmsAccounts
      description: |-
        Base de los endpoints de **datos** financieros: segundo factor verificado y perfil activado (``permissions.FmsReady``). Los que
        crean usan ``idempotent``: exigen ``Idempotency-Key``; repetirla devuelve el original (200).
      summary: Tus cuentas con el saldo derivado del libro (caché cifrado)
      parameters:
      - in: query
        name: include_system
        schema:
          type: boolean
        description: Incluye las cuentas del sistema y las de categoría (no por defecto).
      - in: query
        name: kind
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: '`asset`, `liability`, `income`, `expense` o `equity`.'
      tags:
      - accounts
      security:
      - cvSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin sesión.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`mfa_required`, `finance_not_active` o `account_blocked`.'
    post:
      operationId: fmsAccountCreate
      description: |-
        Base de los endpoints de **datos** financieros: segundo factor verificado y perfil activado (``permissions.FmsReady``). Los que
        crean usan ``idempotent``: exigen ``Idempotency-Key``; repetirla devuelve el original (200).
      summary: Crear una cuenta de activo; el saldo inicial es un asiento contra «Patrimonio
        inicial»
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 8 a 128 caracteres (`A-Za-z0-9._:-`). Repetir la petición devuelve
          el original (200) sin crear otro.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      security:
      - cvSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Cuerpo inválido o falta `Idempotency-Key`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sin sesión.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`mfa_required`, `finance_not_active` o `account_blocked`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No existe (o es de otro usuario).
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Valida pero no se puede aplicar (`code` dice por qué).
